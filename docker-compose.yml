services:
  automix:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/data
    environment:
      DATA_DIR: /data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
